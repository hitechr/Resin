name: Build Fork Image

on:
  workflow_dispatch:

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          retention-days: 1

  build-linux:
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: webui
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Test API
        if: matrix.goarch == 'amd64'
        run: go test ./internal/api
      - name: Build Resin
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p release-bin/linux/${GOARCH}
          go build -trimpath -tags 'with_quic with_wireguard with_grpc with_utls with_embedded_tor with_naive_outbound' \
            -ldflags="-s -w \
            -X github.com/Resinat/Resin/internal/buildinfo.Version=sha-${GITHUB_SHA:0:12} \
            -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=${GITHUB_SHA:0:8}" \
            -o release-bin/linux/${GOARCH}/resin-linux-${GOARCH} ./cmd/resin
      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: release-bin/linux/${{ matrix.goarch }}/resin-linux-${{ matrix.goarch }}
          retention-days: 1

  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-linux
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: release-bin/linux/amd64/
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-arm64
          path: release-bin/linux/arm64/
      - run: chmod +x release-bin/linux/{amd64,arm64}/resin-linux-*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf 'Published image: `%s`\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
